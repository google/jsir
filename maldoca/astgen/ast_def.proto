syntax = "proto2";

package maldoca;

import "maldoca/astgen/type.proto";

option java_multiple_files = true;

// =========
// FieldKind
// =========
//
// Each field in an AST node has a "kind". This is because different kinds of
// AST nodes lead to different forms of IR ops.
//
// Example:
//
// For the assignment expression "x = y", lhs and rhs have the same AST node
// type: Identifier.
//
// AST:
// ```
// AssignmentExpression {
//   lhs: Identifier {"x"}
//   rhs: Identifier {"y"}
// }
// ```
//
// However, lhs is an lvalue, but rhs is an rvalue. Therefore, they lower to
// different IR ops:
//
// ```
// %lhs = identifier_ref {"x"}
// %rhs = identifier {"y"}
// assignment_expression (%lhs, %rhs)
// ```
//
// We can see that "x" lowers to an "identifier_ref" op, but "y" lowers to an
// "identifier" op.
//
// In order to support this, we need to:
//
// - Specify that Assignment::lhs has an "LVAL" kind.
// - Specify that Assignment::rhs has an "RVAL" kind.
// - Specify that the Identifier node type can be both LVAL and RVAL.
enum FieldKind {
  FIELD_KIND_UNSPECIFIED = 0;

  // This field is an attribute (has builtin type).
  FIELD_KIND_ATTR = 1;

  // This field is an rvalue expression. If the expression type has an LVAL
  // kind, we need to create an additional "load" op.
  FIELD_KIND_RVAL = 2;

  // This field is an lvalue expression. The expression type must have an LVAL
  // kind.
  FIELD_KIND_LVAL = 3;

  // This field is a statement.
  FIELD_KIND_STMT = 4;
}

message EnumMemberDefPb {
  optional string name = 1;
  optional string string_value = 2;
}

message EnumDefPb {
  optional string name = 1;
  repeated EnumMemberDefPb members = 2;
}

// This is an unfortunate Babel-specific detail. Since Babel's AST is a JSON
// object, maybe_null and maybe_undefined are different cases.
//
// - "field: string | null"
//   This means the field must exist, but could be null.
//
//   Example: The specification for "AwaitExpression" is this:
//
//   ```
//   interface AwaitExpression <: Expression {
//     type: "AwaitExpression";
//     argument: Expression | null;
//   }
//   ```
//
//   In the above example, "argument" is maybe_null, which means that in the
//   JSON object, the entry must exist, but the value can be null:
//
//   ```
//   {
//     "type": "AwaitExpression",
//     "argument": null  // <---- value is null.
//   }
//   ```
//
// - "field?: string"
//   This means the field might not exist, but if it does, it must be non-null.
//
//   Example: The specification for "CatchClause" is this:
//
//   ```
//   interface CatchClause <: Node {
//     type: "CatchClause";
//     param?: Pattern;
//     body: BlockStatement;
//   }
//   ```
//
//   In the above example, "param" is maybe_undefined, which means that in the
//   JSON object, the entry might not exist at all:
//
//   ```
//   {
//     "type": "CatchClause",
//     // <---- "param" doesn't exist.
//     "body": { ... }
//   }
//   ```
//
// However, it appears that in Babel's AST, there is no field that is both
// maybe_null and maybe_undefined (in other words, there is no such thing as
// "field?: string | null"). Therefore, both cases are represented as
// "std::optional<std::string>".
enum Optionalness {
  // No semantic meaning.
  // go/protodosdonts#do-include-an-unspecified-value-in-an-enum
  OPTIONALNESS_UNSPECIFIED = 0;

  // Field must exist and be non-null.
  OPTIONALNESS_REQUIRED = 1;

  // Field must exist, but might be null.
  OPTIONALNESS_MAYBE_NULL = 2;

  // Field might not exist, but when it exists, it must be non-null.
  OPTIONALNESS_MAYBE_UNDEFINED = 3;
}

// Target representation for code generation of an AST field.
enum GenerationTarget {
  GENERATION_TARGET_UNSPECIFIED = 0;

  // The field is generated in both AST and IR.
  GENERATION_TARGET_BOTH = 1;

  // The field is generated in the AST only (ignored in IR).
  // For example, source location fields where MLIR uses builtin location
  // mechanisms.
  GENERATION_TARGET_AST_ONLY = 2;

  // The field is generated in the IR only (ignored in AST).
  // For example, IR-specific attributes or desugared operands.
  GENERATION_TARGET_IR_ONLY = 3;
}

// Describes how a field maps onto the IR op of its node, when that differs from
// the default (one argument or region named after the field, holding the
// field's type with the field's kind).
message FieldIrMappingPb {
  // [Optional] Name of the op operand that holds the field, if it differs from
  // the field name.
  //
  // At most one of `operand` and `region` can be set.
  optional string operand = 1;

  // [Optional] Name of the op region that holds the field, if it differs from
  // the field name.
  optional string region = 2;

  // [Optional] Kind of the op(s) holding the field, if it differs from the
  // field's kind.
  optional FieldKind kind = 3;

  // [Optional] Name of the op attribute that holds the field when `operand` is
  // unset. Requires `operand`.
  //
  // Example: a static member expression `a.b` holds its property in the
  // `literal_property` attribute, whereas a computed one `a[b]` holds it in the
  // `computed_property` operand.
  optional string literal_attr = 4;

  // The node types that `literal_attr` can hold. Each must name a node with
  // `should_generate_ir_attr`. Required iff `literal_attr` is set.
  repeated string literal_attr_types = 5;

  // [Optional] Kind of the field in the node's LVAL (`*RefOp`) op, if it
  // differs from the field's kind.
  optional FieldKind lval_op_kind = 6;

  // The types held in the node's LVAL op, if they differ from the field's AST
  // types.
  repeated string lval_op_types = 7;

  // Formerly `lval_member_types` and `split`, replaced by
  // `FieldDefPb.alternatives`: the IR mapping of a variant member is declared
  // with the member.
  reserved 8, 9;
  reserved "lval_member_types", "split";

  // [Optional] Name of a bool sibling field. When that sibling is false, the
  // field is held as an attribute in `literal_attr` (dispatching on the
  // member's runtime type over `literal_attr_types`); when it is true, the
  // field is held as an expression in `operand`.
  //
  // The sibling itself is not stored in the IR: converting the IR back to the
  // AST recomputes it from which of `literal_attr` and `operand` is set.
  //
  // Example: `MemberExpression.property` with `literal_unless: "computed"`.
  // Requires `literal_attr` and `operand`.
  optional string literal_unless = 10;
}

// One member of a field's variant type, and how the IR op of the field's node
// holds it. See FieldDefPb.alternatives.
message FieldAlternativePb {
  // The member's type: a scalar type, normally a class.
  optional ScalarTypePb type = 1;

  // [Optional] Name of the IR operand/region that holds this member. Either
  // all alternatives of a field set it or none does. Alternatives sharing an
  // `ir_name` are held in the same operand/region, and must have the same kind.
  //
  // Without `ir_name`, all alternatives are held in the field's single
  // operand/region, as ops of their own kinds.
  optional string ir_name = 2;

  // [Optional] Kind of the IR op that holds this member. Required if the
  // member's node supports several of FIELD_KIND_STMT, FIELD_KIND_RVAL and
  // FIELD_KIND_LVAL (or none); otherwise inferred as the one it supports.
  optional FieldKind kind = 3;
}

// A group of variant members of a field split across several IR
// operands/regions: the alternatives sharing an `ir_name`.
//
// This isn't written in textprotos: `FieldDef::ir_splits()` resolves it from
// the field's `alternatives`.
message FieldIrSplitPb {
  // The variant members (node names) routed to this group.
  repeated string types = 1;

  // Name of the optional op operand that holds these members.
  //
  // Exactly one of `operand` and `region` must be set.
  optional string operand = 2;

  // Name of the optional op region that holds these members: a `StmtRegion`
  // for FIELD_KIND_STMT, an `ExprRegion` for FIELD_KIND_RVAL/FIELD_KIND_LVAL.
  optional string region = 3;

  // Kind of these members (FIELD_KIND_STMT, FIELD_KIND_RVAL or
  // FIELD_KIND_LVAL).
  optional FieldKind kind = 4;
}

// Definition of a field in an AST node.
message FieldDefPb {
  // Name of the field.
  //
  // Must be camelCase.
  optional string name = 1;

  // The optionalness of a field - whether it might be null or undefined.
  optional Optionalness optionalness = 2 [default = OPTIONALNESS_REQUIRED];

  // The type of the field. Exactly one of `type` and `alternatives` is set.
  optional TypePb type = 3;

  // The field kind. E.g. LVAL. Must not be set with `alternatives`.
  optional FieldKind kind = 4 [default = FIELD_KIND_UNSPECIFIED];

  // Target representation for code generation of this field.
  optional GenerationTarget generation_target = 5
      [default = GENERATION_TARGET_BOTH];

  // Whether the field should be enclosed in a region.
  //
  // For example, if the field is a statement, we should create a nested region
  // and enclose the field in it.
  //
  // Detail:
  //
  // Normally, an argument of an IR op is logically executed before the op
  // itself. For example, consider the following AST:
  //
  // ```
  // BinaryExpression {
  //   operator: "+"
  //   left: Identifier { "a" }
  //   right: Identifier { "b" }
  // }
  // ```
  //
  // We can transform it into the following IR:
  //
  // ```
  // %left = jsir.identifier {"a"}
  // %right = jsir.identifier {"b"}
  // %bin_expr = jsir.binary_expression (%left, %right)
  // ```
  //
  // We can see that the IR is, in a sense, a post-order traversal of the AST.
  //
  // However, if an AST node has a statement field, we cannot model it in the IR
  // this way. For example, consider the following AST:
  //
  // ```
  // IfStatement {
  //   test: Identifier { "a" }
  //   body: SomeSortOfStatement {}
  // }
  // ```
  //
  // If we are to use the same approach, we would transform it into the
  // following IR:
  //
  // ```
  // %test = jsir.identifier {"a"}
  // %body = jsir.some_sort_of_statement
  // jsir.if_statement (%test, %body)
  // ```
  //
  // This is problematic, because:
  //
  // 1. The semantics of the if statement is that `body` might not be executed.
  //    However, in this IR it appears that body is always executed.
  //
  // 2. jsir.some_sort_of_statement shouldn't have a return value.
  //    However, in this IR it must have one, just for the if_statement to
  //    reference the op.
  //
  // Therefore, we need to put body **inside** of the if statement, like this:
  //
  // ```
  // %test = jsir.identifier {"a"}
  // jsir.if_statement (%test) {
  //   jsir.some_sort_of_statement
  // }
  // ```
  //
  // Therefore, we define `enclose_in_region` to specify that this AST field,
  // when converted to an IR op, should be further enclosed in a region.
  optional bool enclose_in_region = 6 [default = false];

  // [Optional] Whether the generated MLIR attribute parameter is wrapped in
  // `OptionalParameter<>`, which lets callers omit it.
  //
  // This is opt-in rather than derived from `optionalness` because existing
  // optional class-typed fields are spelled unwrapped, and wrapping them would
  // change the builder APIs of the attributes that already ship.
  optional bool ir_attr_optional_parameter = 7 [default = false];

  // [Optional] How the field maps onto its node's IR op, if not the default.
  optional FieldIrMappingPb ir_mapping = 8;

  // The members of a variant field whose members are held in the IR by
  // different operands/regions or as ops of different kinds, with how each is
  // held. Set instead of `type` (and `kind`) only for such fields: the field's
  // AST type is the variant of the alternatives' types. At least two.
  //
  // Each alternative's kind is its `kind` if set, otherwise the one of
  // FIELD_KIND_STMT, FIELD_KIND_RVAL and FIELD_KIND_LVAL that its node
  // supports. A FIELD_KIND_STMT alternative is held in a region; another
  // alternative is held in a region if the field has `enclose_in_region`,
  // otherwise in an operand.
  //
  // - With `ir_name`s, the field is split across one optional operand/region
  //   per distinct `ir_name`, of which exactly one is set (at most one if the
  //   field is optional). Example: `ForStatement.init: VariableDeclaration |
  //   Expression`, where the declaration is a statement and the expression is
  //   an rvalue:
  //
  //   ```
  //   alternatives {
  //     type { class: "VariableDeclaration" }
  //     ir_name: "init_declaration"
  //   }
  //   alternatives {
  //     type { class: "Expression" }
  //     ir_name: "init_expression"
  //   }
  //   enclose_in_region: true
  //   ```
  //
  // - Without `ir_name`s, the field is held in a single operand named after it,
  //   whose op is an rvalue for some alternatives and an lvalue for the others.
  //   Example: an Identifier `ExportSpecifier.local` is held by a
  //   `jsir.identifier_ref` op, but a StringLiteral one by a
  //   `jsir.string_literal` op:
  //
  //   ```
  //   alternatives {
  //     type { class: "Identifier" }
  //     kind: FIELD_KIND_LVAL
  //   }
  //   alternatives { type { class: "StringLiteral" } }
  //   ```
  repeated FieldAlternativePb alternatives = 9;
}

// MLIR traits.
enum MlirTrait {
  MLIR_TRAIT_INVALID = 0;
  MLIR_TRAIT_PURE = 1;                 // Pure
  MLIR_TRAIT_ISOLATED_FROM_ABOVE = 2;  // IsolatedFromAbove
  MLIR_TRAIT_JSIR_FUNCTION_OP_INTERFACE = 3;  // JsirFunctionOpInterfaceTraits
}

// Definition of an AST node type.
message NodeDefPb {
  // Name of the node.
  //
  // Must be PascalCase.
  // E.g. "BinaryExpression".
  optional string name = 1;

  // Type kind string.
  //
  // In the JavaScript object version of the AST, a special "type" string
  // represents the kind of the node.
  //
  // interface BinaryExpression <: Expression {
  //   type: "BinaryExpression";  <============ This field.
  //   operator: BinaryOperator;
  //   left: Expression | PrivateName;
  //   right: Expression;
  // }
  //
  // The "type" string only has a concrete value in leaf types.
  //
  // interface Expression <: Node { }  <======= No "type" value defined.
  //
  // The existence of a concrete "type" value suggests that this is a leaf type.
  optional string type = 2;

  // Parent nodes to inherit from.
  repeated string parents = 3;

  // Fields defined by this node.
  // Not including fields in parents.
  repeated FieldDefPb fields = 4;

  // If true, automatically generate the corresponding op.
  // If false, the op is expected to be manually written.
  optional bool should_generate_ir_op = 5;

  // Supported kinds. Each kind leads to a different IR op.
  repeated FieldKind kinds = 6;

  // Whether this op has control flow. If so, we will define a high-level IR op,
  // and a low-level IR op.
  optional bool has_control_flow = 7;

  // [Optional] Custom MLIR op name.
  //
  // By default, each AST node corresponds to an equivalent op or interface:
  // - JsNumericLiteral <=> JsirNumericLiteralOp
  // - JsExpression <=> JsirExpressionOpInterface
  //
  // If a custom op name is specified, then the corresponding MLIR op will not
  // be generated, and its ancestors will not have corresponding interfaces.
  // - JsNumericLiteral <=> mlir::arith::ConstantOp
  // - JsExpression <=> mlir::Value
  optional string ir_op_name = 8;

  // Whether this node has a fold operation
  optional bool has_fold = 9;

  // Additional MLIR traits to add to the op definition.
  repeated MlirTrait additional_mlir_traits = 10 [packed = true];

  // If true, automatically generate the corresponding attribute.
  // If false, the attribute is expected to be manually written.
  optional bool should_generate_ir_attr = 11;

  // Whether this attribute has an optional trivia/location parameter:
  // "OptionalParameter<"JsirTriviaAttr">: $loc".
  //
  // This is sugar: it synthesizes an IR-only `loc` field whose type is the
  // `Trivia` node, prepended to the node's own fields. Declaring that field
  // explicitly is equivalent.
  optional bool ir_attr_has_loc = 12 [default = false];

  // Additional traits or interfaces to add to the AttrDef definition.
  repeated string additional_attr_traits = 13;

  // Target representation for code generation of this node.
  //
  // `GENERATION_TARGET_IR_ONLY` declares a node that exists purely in the IR:
  // no AST class, JSON conversion, or TypeScript interface is generated for it.
  // For example, `Location` is the IR counterpart of `SourceLocation` and
  // carries extra bookkeeping that the AST stores elsewhere.
  optional GenerationTarget generation_target = 14
      [default = GENERATION_TARGET_BOTH];

  // If true, the generated attribute is defined with `LocationAttrDef` instead
  // of `AttrDef`. On top of a plain `AttrDef`, this adds the
  // `NativeAttrTrait<"IsLocation">` trait and changes the C++ base class to
  // `::mlir::LocationAttr`, so the attribute can be used as an
  // `::mlir::Location` on an operation.
  optional bool ir_attr_is_location = 15 [default = false];

  // Whether this class is plain data attached to the AST rather than an AST
  // node in its own right, i.e. whether it carries auxiliary information
  // (source locations, comments, symbol references, ...) instead of
  // information necessary to represent the program's structure. E.g. Babel's
  // `SourceLocation` (`node.loc`) and comments hang off nodes, but traversal
  // doesn't descend into them.
  //
  // Generated code that models nodes (e.g. Python AST node classes, visitor
  // keys) treats such a class as plain data.
  optional bool is_plain_object = 16 [default = false];

  // MLIR traits that this node's ops must not have, even though an ancestor
  // adds them via `additional_mlir_traits`.
  //
  // Example: `MemberExpression` derives from `Pattern` and `LVal`, which are
  // `Pure`, but evaluating a member expression may run a getter.
  repeated MlirTrait excluded_mlir_traits = 17 [packed = true];

  // If non-empty, only the ops of these kinds have a folder. Requires
  // `has_fold`. If empty, all the node's ops have a folder.
  //
  // Example: `MemberExpression` folds its rvalue op, but not its lvalue
  // (`*RefOp`) op.
  repeated FieldKind fold_kinds = 18 [packed = true];
}

// Definition of a tagged union node type.
//
// SWC likes to use enum types to model inheritance. This union type simplifies
// the AST definitions by allowing us to mimic this model and implicitly add the
// associated union type as a parent to all the enum members.
message UnionTypePb {
  // Name of the union node.
  //
  // Must be PascalCase.
  // E.g. "BinaryExpression".
  optional string name = 1;

  // Parent nodes to inherit from.
  repeated string parents = 2;

  // Types which are members of this union.
  repeated string types = 3;

  // If true, automatically generate the corresponding op.
  // If false, the op is expected to be manually written.
  optional bool should_generate_ir_op = 4;

  // Supported kinds. Each kind leads to a different IR op.
  repeated FieldKind kinds = 5;

  // [Optional] Custom MLIR op name.
  optional string ir_op_name = 6;

  // If true, automatically generate the corresponding IR dispatch code.
  optional bool should_generate_dispatch = 7 [default = true];

  message DispatchOverridePb {
    // The name of the union member type to override.
    // E.g., "Identifier".
    optional string type = 1;

    // The name of the visitor function to call.
    // E.g., "VisitIdentifierRef" instead of the default "VisitIdentifier".
    optional string visitor = 2;

    // The IR op name to use for this member.
    // E.g., "jsir.IdentifierRef" instead of "jsir.Identifier".
    optional string ir_op_name = 3;
  }

  // Overrides for generated dispatch code.
  //
  // Allows customizing the generated visitor and IR op name for specific
  // union members.
  repeated DispatchOverridePb dispatch_overrides = 8;

  // Set of union member type names to skip in the generated dispatch code.
  //
  // If a member is skipped, it will not be included in the generated
  // dispatch methods, and must be handled manually if needed.
  //
  // E.g., "InvalidExpression" to skip generating dispatch for invalid nodes.
  repeated string dispatch_skip = 9;
}

// Top-level AST definition.
message AstDefPb {
  // The shortened language name.
  // E.g. "js"
  optional string lang_name = 1;

  repeated EnumDefPb enums = 2;

  repeated NodeDefPb nodes = 3;

  repeated UnionTypePb union_types = 4;
}
