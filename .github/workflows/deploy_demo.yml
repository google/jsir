# Builds the in-browser JSIR demo (maldoca/js/ir/wasm) and deploys it to GitHub
# Pages.
#
# Requires Settings > Pages > Build and deployment > Source to be set to
# "GitHub Actions".
name: Deploy demo to GitHub Pages
permissions: read-all
on:
  push:
    branches:
      - main
  workflow_dispatch:
# Let an in-progress deployment finish, but skip deployments queued in between.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true
      - name: Build the demo site
        run: |
          cd ${{ github.workspace }}
          bazelisk run //maldoca/js/ir/wasm:stage_site -- ${{ runner.temp }}/site
      - name: Upload the demo site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
